<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Hourly Productivity Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .field {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #f1f5f9;
        }

        .delete-button {
            background: #dc2626;
            padding: 6px 12px;
            margin: 0;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Team Hourly Productivity Tracker</h1>

    <div class="subtitle">
        Project and productivity management
    </div>


    <!-- PROJECT SETUP -->

    <div class="card">

        <h2>Project Setup</h2>

        <div class="form-row">

            <div class="field">

                <label for="projectName">
                    Project Name
                </label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="Example: WRMC Patient Collection">

            </div>


            <div class="field">

                <label for="projectTarget">
                    Daily Target
                </label>

                <input
                    type="number"
                    id="projectTarget"
                    placeholder="Example: 125">

            </div>

        </div>


        <button
            type="button"
            id="addProjectButton">

            Add Project

        </button>


        <div id="message"></div>


        <table>

            <thead>

                <tr>
                    <th>Project</th>
                    <th>Daily Target</th>
                    <th>Action</th>
                </tr>

            </thead>


            <tbody id="projectTable">

            </tbody>

        </table>

    </div>

</div>

    <!-- ============================= -->
<!-- EMPLOYEE SETUP -->
<!-- ============================= -->

<div class="card">

    <h2>Employee Setup</h2>

    <div class="form-row">

        <div class="field">

            <label for="employeeName">
                Employee Name
            </label>

            <input
                type="text"
                id="employeeName"
                placeholder="Example: Sarath Nair">

        </div>


        <div class="field">

            <label for="employeeCode">
                Employee ID
            </label>

            <input
                type="text"
                id="employeeCode"
                placeholder="Example: 7260">

        </div>


        <div class="field">

            <label for="employeeProject">
                Project
            </label>

            <select id="employeeProject">

                <option value="">
                    Select Project
                </option>

            </select>

        </div>

    </div>


    <button
        type="button"
        id="addEmployeeButton">

        Add Employee

    </button>


    <div id="employeeMessage"></div>


    <table>

        <thead>

            <tr>

                <th>Employee</th>

                <th>EMP ID</th>

                <th>Project</th>

                <th>Daily Target</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="employeeTable">

        </tbody>

    </table>

</div>

<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://yhoblmvujfqnspaxdfav.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_fiXzds8sZeg1f5cNcnzhlQ_Gm_x71af";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   LOAD PROJECTS
========================================= */

async function loadProjects() {

    const result =
        await supabaseClient
            .from("projects")
            .select("*")
            .order("project_name");


    if (result.error) {

        console.error(
            "Load projects error:",
            result.error
        );

        showMessage(
            "Unable to load projects: " +
            result.error.message,
            true
        );

        return;
    }


    displayProjects(result.data);
}


/* =========================================
   DISPLAY PROJECTS
========================================= */

function displayProjects(projectList) {

    const table =
        document.getElementById(
            "projectTable"
        );


    table.innerHTML = "";


    projectList.forEach(function(project) {

        const row =
            document.createElement("tr");


        const nameCell =
            document.createElement("td");

        nameCell.textContent =
            project.project_name;


        const targetCell =
            document.createElement("td");

        targetCell.textContent =
            project.daily_target;


        const actionCell =
            document.createElement("td");


        const deleteButton =
            document.createElement("button");


        deleteButton.textContent =
            "Delete";


        deleteButton.className =
            "delete-button";


        deleteButton.type =
            "button";


        deleteButton.onclick =
            function() {

                deleteProject(project.id);

            };


        actionCell.appendChild(
            deleteButton
        );


        row.appendChild(nameCell);

        row.appendChild(targetCell);

        row.appendChild(actionCell);


        table.appendChild(row);

    });

}


/* =========================================
   ADD PROJECT
========================================= */

async function addProject() {

    const name =
        document
            .getElementById("projectName")
            .value
            .trim();


    const target =
        Number(
            document
                .getElementById("projectTarget")
                .value
        );


    if (name === "") {

        showMessage(
            "Please enter a project name.",
            true
        );

        return;
    }


    if (!target || target <= 0) {

        showMessage(
            "Please enter a valid daily target.",
            true
        );

        return;
    }


    showMessage(
        "Saving project..."
    );


    const result =
        await supabaseClient
            .from("projects")
            .insert({

                project_name: name,

                daily_target: target

            })
            .select();


    if (result.error) {

        console.error(
            "Add project error:",
            result.error
        );

        showMessage(
            "Unable to save project: " +
            result.error.message,
            true
        );

        return;
    }


    document
        .getElementById("projectName")
        .value = "";


    document
        .getElementById("projectTarget")
        .value = "";


    showMessage(
        "Project saved successfully."
    );

/* =========================================
   EMPLOYEE FUNCTIONS
========================================= */

async function loadEmployeeProjects() {

    const result =
        await supabaseClient
            .from("projects")
            .select("*")
            .order("project_name");


    if (result.error) {

        console.error(
            "Load employee projects error:",
            result.error
        );

        return;
    }


    const dropdown =
        document.getElementById(
            "employeeProject"
        );


    dropdown.innerHTML = `
        <option value="">
            Select Project
        </option>
    `;


    result.data.forEach(function(project) {

        const option =
            document.createElement("option");


        option.value =
            project.id;


        option.textContent =
            project.project_name +
            " (Target: " +
            project.daily_target +
            ")";


        dropdown.appendChild(option);

    });

}


/* =========================================
   ADD EMPLOYEE
========================================= */

async function addEmployee() {

    const name =
        document
            .getElementById("employeeName")
            .value
            .trim();


    const employeeCode =
        document
            .getElementById("employeeCode")
            .value
            .trim();


    const projectId =
        Number(
            document
                .getElementById("employeeProject")
                .value
        );


    if (name === "") {

        showEmployeeMessage(
            "Please enter employee name.",
            true
        );

        return;
    }


    if (employeeCode === "") {

        showEmployeeMessage(
            "Please enter employee ID.",
            true
        );

        return;
    }


    if (!projectId) {

        showEmployeeMessage(
            "Please select a project.",
            true
        );

        return;
    }


    showEmployeeMessage(
        "Saving employee..."
    );


    const result =
        await supabaseClient
            .from("employees")
            .insert({

                employee_name: name,

                employee_code: employeeCode,

                project_id: projectId

            })
            .select();


    if (result.error) {

        console.error(
            "Add employee error:",
            result.error
        );


        showEmployeeMessage(
            "Unable to save employee: " +
            result.error.message,
            true
        );

        return;
    }


    document
        .getElementById("employeeName")
        .value = "";


    document
        .getElementById("employeeCode")
        .value = "";


    document
        .getElementById("employeeProject")
        .value = "";


    showEmployeeMessage(
        "Employee saved successfully."
    );


    loadEmployees();

}


/* =========================================
   LOAD EMPLOYEES
========================================= */

async function loadEmployees() {

    const result =
        await supabaseClient
            .from("employees")
            .select(`
                id,
                employee_name,
                employee_code,
                project_id,
                projects (
                    project_name,
                    daily_target
                )
            `)
            .eq("active", true)
            .order("employee_name");


    if (result.error) {

        console.error(
            "Load employees error:",
            result.error
        );

        showEmployeeMessage(
            "Unable to load employees: " +
            result.error.message,
            true
        );

        return;
    }


    const table =
        document.getElementById(
            "employeeTable"
        );


    table.innerHTML = "";


    result.data.forEach(function(employee) {

        const row =
            document.createElement("tr");


        const nameCell =
            document.createElement("td");

        nameCell.textContent =
            employee.employee_name;


        const codeCell =
            document.createElement("td");

        codeCell.textContent =
            employee.employee_code;


        const projectCell =
            document.createElement("td");

        projectCell.textContent =
            employee.projects
            ? employee.projects.project_name
            : "";


        const targetCell =
            document.createElement("td");

        targetCell.textContent =
            employee.projects
            ? employee.projects.daily_target
            : "";


        const actionCell =
            document.createElement("td");


        const deleteButton =
            document.createElement("button");


        deleteButton.textContent =
            "Delete";


        deleteButton.className =
            "delete-button";


        deleteButton.type =
            "button";


        deleteButton.onclick =
            function() {

                deleteEmployee(employee.id);

            };


        actionCell.appendChild(
            deleteButton
        );


        row.appendChild(nameCell);

        row.appendChild(codeCell);

        row.appendChild(projectCell);

        row.appendChild(targetCell);

        row.appendChild(actionCell);


        table.appendChild(row);

    });

}


/* =========================================
   DELETE EMPLOYEE
========================================= */

async function deleteEmployee(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this employee?"
        );


    if (!confirmed) {

        return;

    }


    const result =
        await supabaseClient
            .from("employees")
            .delete()
            .eq("id", id);


    if (result.error) {

        showEmployeeMessage(
            "Unable to delete employee: " +
            result.error.message,
            true
        );

        return;
    }


    showEmployeeMessage(
        "Employee deleted."
    );


    loadEmployees();

}


/* =========================================
   EMPLOYEE MESSAGE
========================================= */

function showEmployeeMessage(
    text,
    isError = false
) {

    const message =
        document.getElementById(
            "employeeMessage"
        );


    message.textContent =
        text;


    message.style.marginTop =
        "15px";


    message.style.fontWeight =
        "bold";


    message.style.color =
        isError
        ? "red"
        : "green";

}


/* =========================================
   EMPLOYEE BUTTON
========================================= */

document
    .getElementById(
        "addEmployeeButton"
    )
    .addEventListener(
        "click",
        addEmployee
    );


loadEmployeeProjects();

loadEmployees();
    
    loadProjects();

}


/* =========================================
   DELETE PROJECT
========================================= */

async function deleteProject(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this project?"
        );


    if (!confirmed) {

        return;
    }


    const result =
        await supabaseClient
            .from("projects")
            .delete()
            .eq("id", id);


    if (result.error) {

        console.error(
            "Delete project error:",
            result.error
        );

        showMessage(
            "Unable to delete project: " +
            result.error.message,
            true
        );

        return;
    }


    showMessage(
        "Project deleted."
    );


    loadProjects();

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    isError = false
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.color =
        isError
        ? "red"
        : "green";

}


/* =========================================
   BUTTON EVENT
========================================= */

document
    .getElementById(
        "addProjectButton"
    )
    .addEventListener(
        "click",
        addProject
    );


/* =========================================
   START
========================================= */

loadProjects();

</script>

</body>
</html>
