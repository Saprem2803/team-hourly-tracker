/* =========================================================
   DELETE PROJECT
========================================================= */

async function deleteProject(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this project?"
        );

    if (!confirmed) return;

    showProjectMessage(
        "Checking project..."
    );

    try {

        const employeeCheck =
            await supabaseClient
                .from("employees")
                .select(
                    "id, employee_name"
                )
                .eq(
                    "project_id",
                    id
                );

        if (employeeCheck.error) {

            console.error(
                "Project usage check error:",
                employeeCheck.error
            );

            showProjectMessage(
                "Unable to check project usage: " +
                employeeCheck.error.message,
                true
            );

            return;
        }

        if (
            employeeCheck.data &&
            employeeCheck.data.length > 0
        ) {

            const names =
                employeeCheck.data
                    .map(
                        function(employee) {
                            return employee.employee_name;
                        }
                    )
                    .join(", ");

            showProjectMessage(
                "Cannot delete project. Assigned to: " +
                names,
                true
            );

            return;
        }

        showProjectMessage(
            "Deleting project..."
        );

        const result =
            await supabaseClient
                .from("projects")
                .delete()
                .eq("id", id)
                .select();

        console.log(
            "Delete project result:",
            result
        );

        if (result.error) {

            console.error(
                "Delete project error:",
                result.error
            );

            showProjectMessage(
                "Unable to delete project: " +
                result.error.message,
                true
            );

            return;
        }

        if (
            !result.data ||
            result.data.length === 0
        ) {

            showProjectMessage(
                "Project was not deleted. Check Supabase DELETE policy.",
                true
            );

            return;
        }

        showProjectMessage(
            "Project deleted successfully."
        );

        await loadProjects();
        await loadEmployees();

    } catch (error) {

        console.error(
            "Unexpected delete project error:",
            error
        );

        showProjectMessage(
            "Unexpected error: " +
            error.message,
            true
        );
    }
}

/* =========================================================
   DAILY TARGET
========================================================= */

function getDailyTarget(
    employee,
    attendance
) {

    const projectTarget =
        Number(
            employee.projects
            ? employee.projects.daily_target
            : 0
        );

    if (
        attendance === "Present"
    ) {

        return projectTarget;
    }

    if (
        attendance === "Half Day"
    ) {

        return Math.ceil(
            projectTarget / 2
        );
    }

    return 0;
}


/* =========================================================
   BUILD DAILY TRACKER
========================================================= */

function buildDailyTracker() {

    const table =
        document.getElementById(
            "dailyTrackerTable"
        );

    if (!table) return;

    table.innerHTML = "";

    employees.forEach(
        function(employee, index) {

            const row =
                document.createElement("tr");


            /* EMPLOYEE */

            const employeeCell =
                document.createElement("td");

            employeeCell.textContent =
                employee.employee_name;

            row.appendChild(employeeCell);


            /* EMP ID */

            const codeCell =
                document.createElement("td");

            codeCell.textContent =
                employee.employee_code;

            row.appendChild(codeCell);


            /* PROJECT */

            const projectCell =
                document.createElement("td");

            projectCell.textContent =
                employee.projects
                ? employee.projects.project_name
                : "";

            row.appendChild(projectCell);


            /* ATTENDANCE */

            const attendanceCell =
                document.createElement("td");

            const attendance =
                document.createElement("select");

            attendance.id =
                "attendance_" + index;

            attendance.innerHTML = `
                <option value="Present">Present</option>
                <option value="Half Day">Half Day</option>
                <option value="Absent">Absent</option>
            `;

            attendance.addEventListener(
                "change",
                function() {

                    calculateDailyRow(index);

                }
            );

            attendanceCell.appendChild(
                attendance
            );

            row.appendChild(
                attendanceCell
            );


            /* TARGET */

            const targetCell =
                document.createElement("td");

            targetCell.id =
                "dailyTarget_" + index;

            targetCell.textContent =
                getDailyTarget(
                    employee,
                    "Present"
                );

            row.appendChild(targetCell);


            /* 9 HOURS */

            for (
                let hour = 1;
                hour <= 9;
                hour++
            ) {

                const cell =
                    document.createElement("td");

                const input =
                    document.createElement("input");

                input.type =
                    "number";

                input.min =
                    "0";

                input.value =
                    "0";

                input.className =
                    "hour-input";

                input.id =
                    "productivity_" +
                    index +
                    "_" +
                    hour;

                input.addEventListener(
                    "input",
                    function() {

                        calculateDailyRow(index);

                    }
                );

                cell.appendChild(input);

                row.appendChild(cell);
            }


            /* BREAK */

            const breakCell =
                document.createElement("td");

            const breakInput =
                document.createElement("input");

            breakInput.type =
                "number";

            breakInput.min =
                "0";

            breakInput.max =
                "60";

            breakInput.value =
                "0";

            breakInput.className =
                "hour-input";

            breakInput.id =
                "break_" + index;

            breakInput.addEventListener(
                "input",
                function() {

                    calculateDailyRow(index);

                }
            );

            breakCell.appendChild(
                breakInput
            );

            row.appendChild(breakCell);


            /* BREAK STATUS */

            const breakStatusCell =
                document.createElement("td");

            breakStatusCell.id =
                "breakStatus_" + index;

            breakStatusCell.textContent =
                "0 / 60 min";

            row.appendChild(
                breakStatusCell
            );


            /* ACHIEVED */

            const achievedCell =
                document.createElement("td");

            achievedCell.id =
                "achieved_" + index;

            achievedCell.textContent =
                "0";

            row.appendChild(achievedCell);


            /* REMAINING */

            const remainingCell =
                document.createElement("td");

            remainingCell.id =
                "remaining_" + index;

            remainingCell.textContent =
                getDailyTarget(
                    employee,
                    "Present"
                );

            row.appendChild(remainingCell);


            /* PERCENTAGE */

            const percentageCell =
                document.createElement("td");

            percentageCell.id =
                "percentage_" + index;

            percentageCell.textContent =
                "0%";

            row.appendChild(percentageCell);

            table.appendChild(row);

            calculateDailyRow(index);
        }
    );

    updateSummary();
}


/* =========================================================
   CALCULATE DAILY ROW
========================================================= */

function calculateDailyRow(index) {

    const employee =
        employees[index];

    if (!employee) return;

    const attendanceElement =
        document.getElementById(
            "attendance_" + index
        );

    if (!attendanceElement) return;

    const attendance =
        attendanceElement.value;

    const target =
        getDailyTarget(
            employee,
            attendance
        );

    document.getElementById(
        "dailyTarget_" + index
    ).textContent = target;


    let achieved = 0;


    /* HOURLY PRODUCTIVITY */

    for (
        let hour = 1;
        hour <= 9;
        hour++
    ) {

        const input =
            document.getElementById(
                "productivity_" +
                index +
                "_" +
                hour
            );

        if (
            input &&
            attendance !== "Absent"
        ) {

            achieved +=
                Number(input.value) || 0;
        }
    }


    /* ABSENT */

    if (
        attendance === "Absent"
    ) {

        achieved = 0;

        for (
            let hour = 1;
            hour <= 9;
            hour++
        ) {

            const input =
                document.getElementById(
                    "productivity_" +
                    index +
                    "_" +
                    hour
                );

            if (input) {
                input.value = 0;
            }
        }
    }


    /* BREAK */

    const breakInput =
        document.getElementById(
            "break_" + index
        );

    let breakMinutes =
        Number(
            breakInput
                ? breakInput.value
                : 0
        ) || 0;

    if (breakMinutes < 0) {
        breakMinutes = 0;
    }

    if (breakMinutes > 60) {

        breakMinutes = 60;

        if (breakInput) {
            breakInput.value = 60;
        }
    }


    const breakStatus =
        document.getElementById(
            "breakStatus_" + index
        );

    if (breakStatus) {

        breakStatus.textContent =
            breakMinutes +
            " / 60 min";

        breakStatus.className =
            breakMinutes === 60
            ? "green"
            : "yellow";
    }


    /* REMAINING */

    const remaining =
        Math.max(
            target - achieved,
            0
        );


    /* PERCENTAGE */

    const percentage =
        target > 0
        ? (
            achieved / target
        ) * 100
        : 0;


    document.getElementById(
        "achieved_" + index
    ).textContent =
        achieved;

    document.getElementById(
        "remaining_" + index
    ).textContent =
        remaining;


    const percentageCell =
        document.getElementById(
            "percentage_" + index
        );

    percentageCell.textContent =
        percentage.toFixed(1) +
        "%";


    if (
        percentage >= 100
    ) {

        percentageCell.className =
            "green";

    } else if (
        percentage >= 80
    ) {

        percentageCell.className =
            "yellow";

    } else {

        percentageCell.className =
            "red";
    }

    updateSummary();
}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {

    let totalTarget = 0;

    let totalAchieved = 0;


    employees.forEach(
        function(employee, index) {

            const attendanceElement =
                document.getElementById(
                    "attendance_" + index
                );

            if (!attendanceElement) return;

            const attendance =
                attendanceElement.value;

            const target =
                getDailyTarget(
                    employee,
                    attendance
                );

            totalTarget += target;


            for (
                let hour = 1;
                hour <= 9;
                hour++
            ) {

                const input =
                    document.getElementById(
                        "productivity_" +
                        index +
                        "_" +
                        hour
                    );

                if (
                    input &&
                    attendance !== "Absent"
                ) {

                    totalAchieved +=
                        Number(input.value) || 0;
                }
            }
        }
    );


    const totalRemaining =
        Math.max(
            totalTarget -
            totalAchieved,
            0
        );


    const teamAchievement =
        totalTarget > 0
        ? (
            totalAchieved /
            totalTarget
        ) * 100
        : 0;


    document.getElementById(
        "totalEmployees"
    ).textContent =
        employees.length;

    document.getElementById(
        "totalTarget"
    ).textContent =
        totalTarget;

    document.getElementById(
        "totalAchieved"
    ).textContent =
        totalAchieved;

    document.getElementById(
        "totalRemaining"
    ).textContent =
        totalRemaining;

    document.getElementById(
        "teamAchievement"
    ).textContent =
        teamAchievement.toFixed(1) +
        "%";
}


/* =========================================================
   SAVE DAILY TRACKER
========================================================= */

async function saveDailyTracker() {

    console.log(
        "SAVE DAILY TRACKER FUNCTION CALLED"
    );

    const trackerDate =
        document.getElementById(
            "trackerDate"
        ).value;

    if (!trackerDate) {

        showTrackerMessage(
            "Please select a date.",
            true
        );

        return;
    }

    if (employees.length === 0) {

        showTrackerMessage(
            "No employees found.",
            true
        );

        return;
    }

    showTrackerMessage(
        "Saving daily tracker..."
    );


    try {

        const records = [];


        employees.forEach(
            function(employee, index) {

                const attendance =
                    document.getElementById(
                        "attendance_" + index
                    ).value;


                const dailyTarget =
                    getDailyTarget(
                        employee,
                        attendance
                    );


                const hours = [];


                for (
                    let hour = 1;
                    hour <= 9;
                    hour++
                ) {

                    const input =
                        document.getElementById(
                            "productivity_" +
                            index +
                            "_" +
                            hour
                        );

                    hours.push(
                        Number(
                            input.value
                        ) || 0
                    );
                }


                let breakMinutes =
                    Number(
                        document.getElementById(
                            "break_" + index
                        ).value
                    ) || 0;


                if (breakMinutes > 60) {
                    breakMinutes = 60;
                }


                let achieved =
                    hours.reduce(
                        function(total, value) {

                            return total + value;

                        },
                        0
                    );


                if (
                    attendance === "Absent"
                ) {

                    achieved = 0;
                }


                const remaining =
                    Math.max(
                        dailyTarget -
                        achieved,
                        0
                    );


                const achievementPercentage =
                    dailyTarget > 0
                    ? (
                        achieved /
                        dailyTarget
                    ) * 100
                    : 0;


                records.push({

                    tracker_date:
                        trackerDate,

                    employee_id:
                        employee.id,

                    attendance:
                        attendance,

                    daily_target:
                        dailyTarget,

                    hour_6_7:
                        hours[0],

                    hour_7_8:
                        hours[1],

                    hour_8_9:
                        hours[2],

                    hour_9_10:
                        hours[3],

                    hour_10_11:
                        hours[4],

                    hour_11_12:
                        hours[5],

                    hour_12_1:
                        hours[6],

                    hour_1_2:
                        hours[7],

                    hour_2_3:
                        hours[8],

                    break_minutes:
                        breakMinutes,

                    achieved:
                        achieved,

                    remaining:
                        remaining,

                    achievement_percentage:
                        achievementPercentage
                });
            }
        );


        console.log(
            "Daily records:",
            records
        );


        const result =
            await supabaseClient
                .from("daily_productivity")
                .upsert(
                    records,
                    {
                        onConflict:
                            "tracker_date,employee_id"
                    }
                );


        console.log(
            "Save tracker result:",
            result
        );


        if (result.error) {

            console.error(
                "Save tracker error:",
                result.error
            );

            showTrackerMessage(
                "Unable to save tracker: " +
                result.error.message,
                true
            );

            return;
        }


        showTrackerMessage(
            "Daily tracker saved successfully."
        );

    } catch (error) {

        console.error(
            "Unexpected tracker error:",
            error
        );

        showTrackerMessage(
            "Unexpected error: " +
            error.message,
            true
        );
    }
}


/* =========================================================
   LOAD DAILY TRACKER
========================================================= */

async function loadDailyTracker() {

    const trackerDate =
        document.getElementById(
            "trackerDate"
        ).value;

    if (!trackerDate) return;


    try {

        const result =
            await supabaseClient
                .from("daily_productivity")
                .select("*")
                .eq(
                    "tracker_date",
                    trackerDate
                );


        console.log(
            "Load tracker result:",
            result
        );


        if (result.error) {

            console.error(
                "Load tracker error:",
                result.error
            );

            showTrackerMessage(
                "Unable to load tracker: " +
                result.error.message,
                true
            );

            return;
        }


        const records =
            result.data || [];


        if (records.length === 0) {

            showTrackerMessage(
                "No saved data found for " +
                trackerDate
            );

            return;
        }


        employees.forEach(
            function(employee, index) {

                const record =
                    records.find(
                        function(item) {

                            return (
                                item.employee_id ===
                                employee.id
                            );

                        }
                    );


                if (!record) return;


                const attendance =
                    document.getElementById(
                        "attendance_" + index
                    );

                attendance.value =
                    record.attendance ||
                    "Present";


                const hourlyValues = [

                    record.hour_6_7,
                    record.hour_7_8,
                    record.hour_8_9,
                    record.hour_9_10,
                    record.hour_10_11,
                    record.hour_11_12,
                    record.hour_12_1,
                    record.hour_1_2,
                    record.hour_2_3

                ];


                hourlyValues.forEach(
                    function(value, hourIndex) {

                        const input =
                            document.getElementById(
                                "productivity_" +
                                index +
                                "_" +
                                (hourIndex + 1)
                            );

                        if (input) {

                            input.value =
                                value || 0;
                        }
                    }
                );


                const breakInput =
                    document.getElementById(
                        "break_" + index
                    );

                breakInput.value =
                    record.break_minutes || 0;


                calculateDailyRow(index);
            }
        );


        showTrackerMessage(
            "Saved data loaded for " +
            trackerDate
        );

    } catch (error) {

        console.error(
            "Unexpected load tracker error:",
            error
        );
    }
}
