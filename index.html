<!-- ============================================================
     LIVE SKY WALLPAPER — realistic sky + drifting clouds
============================================================ -->
<script>
(function () {
    var canvas = document.getElementById('liveWallpaper');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var W = 0, H = 0, DPR = 1, SF = 1;
    var clouds = [], sprites = [];
    var rafId = null, lastFrame = 0;
    var P = { x: 0, y: 0, tx: 0, ty: 0 };

    var SPRITE_W = 320, SPRITE_H = 190, SS = 2;  // SS = supersampling factor

    /* ---------- deterministic RNG so the cloud shapes are stable ---------- */
    function mulberry32(a) {
        return function () {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            var t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    /* ---------- pre-render one soft, volumetric cloud sprite ---------- */
    function makeCloudSprite(seed) {
        var rnd = mulberry32(seed);
        var cv = document.createElement('canvas');
        cv.width  = SPRITE_W * SS;
        cv.height = SPRITE_H * SS;
        var g = cv.getContext('2d');
        g.scale(SS, SS);

        var baseY = SPRITE_H * 0.66;
        var puffs = 16 + Math.floor(rnd() * 12);

        // build the cloud body from many overlapping soft puffs
        g.globalCompositeOperation = 'lighter';
        for (var i = 0; i < puffs; i++) {
            var t   = puffs === 1 ? 0.5 : i / (puffs - 1);
            var arc = Math.sin(Math.PI * (0.08 + t * 0.84));
            var cx  = SPRITE_W * (0.10 + t * 0.80) + (rnd() - 0.5) * SPRITE_W * 0.10;
            var r   = SPRITE_H * (0.10 + rnd() * 0.12) * (0.55 + arc * 1.05);
            var cy  = baseY - arc * SPRITE_H * 0.30 - rnd() * SPRITE_H * 0.08;

            var grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
            grad.addColorStop(0,    'rgba(255,255,255,0.85)');
            grad.addColorStop(0.45, 'rgba(255,255,255,0.55)');
            grad.addColorStop(0.78, 'rgba(255,255,255,0.18)');
            grad.addColorStop(1,    'rgba(255,255,255,0)');
            g.fillStyle = grad;
            g.beginPath();
            g.arc(cx, cy, r, 0, Math.PI * 2);
            g.fill();
        }
        g.globalCompositeOperation = 'source-over';

        // cool shading on the underside → gives the cloud volume
        g.globalCompositeOperation = 'source-atop';
        var shade = g.createLinearGradient(0, SPRITE_H * 0.35, 0, SPRITE_H);
        shade.addColorStop(0,    'rgba(146,168,196,0)');
        shade.addColorStop(0.55, 'rgba(146,168,196,0.16)');
        shade.addColorStop(1,    'rgba(120,146,180,0.42)');
        g.fillStyle = shade;
        g.fillRect(0, 0, SPRITE_W, SPRITE_H);

        // warm sunlit highlight on top
        var light = g.createLinearGradient(0, 0, 0, SPRITE_H * 0.55);
        light.addColorStop(0, 'rgba(255,253,245,0.30)');
        light.addColorStop(1, 'rgba(255,253,245,0)');
        g.fillStyle = light;
        g.fillRect(0, 0, SPRITE_W, SPRITE_H);
        g.globalCompositeOperation = 'source-over';

        return cv;
    }

    /* ---------- cloud field: three depth layers ---------- */
    function initClouds() {
        sprites = [];
        for (var s = 0; s < 6; s++) sprites.push(makeCloudSprite(1000 + s * 137));

        var layers = [
            // far / small / slow / faint
            { n: 5, sMin: 0.55, sMax: 0.95, vMin: 5,  vMax: 11, aMin: 0.35, aMax: 0.60, yMin: 0.02, yMax: 0.26 },
            // mid
            { n: 4, sMin: 1.00, sMax: 1.60, vMin: 11, vMax: 20, aMin: 0.60, aMax: 0.85, yMin: 0.10, yMax: 0.38 },
            // near / large / fast
            { n: 3, sMin: 1.90, sMax: 2.80, vMin: 20, vMax: 34, aMin: 0.80, aMax: 1.00, yMin: 0.18, yMax: 0.48 }
        ];

        clouds = [];
        layers.forEach(function (d, layer) {
            for (var i = 0; i < d.n; i++) {
                var scale = d.sMin + Math.random() * (d.sMax - d.sMin);
                var w = SPRITE_W * scale;
                clouds.push({
                    sprite: sprites[Math.floor(Math.random() * sprites.length)],
                    scale: scale,
                    x: Math.random() * (W + w) - w,
                    y: d.yMin + Math.random() * (d.yMax - d.yMin),
                    speed: d.vMin + Math.random() * (d.vMax - d.vMin),
                    alpha: d.aMin + Math.random() * (d.aMax - d.aMin),
                    flip: Math.random() < 0.5,
                    depth: layer
                });
            }
        });

        clouds.sort(function (a, b) { return a.depth - b.depth; });
    }

    /* ---------- sun glow ---------- */
    function drawSun() {
        var sx = W * 0.76, sy = H * 0.12;
        var r  = Math.max(W, H) * 0.45;
        var g  = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
        g.addColorStop(0,    'rgba(255,251,236,0.55)');
        g.addColorStop(0.12, 'rgba(255,247,222,0.26)');
        g.addColorStop(0.35, 'rgba(255,240,205,0.10)');
        g.addColorStop(1,    'rgba(255,240,205,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    }

    /* ---------- warm haze near the horizon ---------- */
    function drawHaze() {
        var top = H * 0.72;
        var g = ctx.createLinearGradient(0, top, 0, H);
        g.addColorStop(0, 'rgba(255,252,246,0)');
        g.addColorStop(1, 'rgba(255,252,246,0.22)');
        ctx.fillStyle = g;
        ctx.fillRect(0, top, W, H - top);
    }

    /* ---------- draw the clouds ---------- */
    function drawClouds() {
        for (var i = 0; i < clouds.length; i++) {
            var c = clouds[i];
            var w = SPRITE_W * c.scale * SF;
            var h = SPRITE_H * c.scale * SF;

            var px = c.x + P.x * (8 + c.depth * 12);
            var py = c.y * H + P.y * (5 + c.depth * 8);

            ctx.globalAlpha = c.alpha;
            if (c.flip) {
                ctx.save();
                ctx.translate(px + w, py);
                ctx.scale(-1, 1);
                ctx.drawImage(c.sprite, 0, 0, w, h);
                ctx.restore();
            } else {
                ctx.drawImage(c.sprite, px, py, w, h);
            }
        }
        ctx.globalAlpha = 1;
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        drawSun();
        drawHaze();
        drawClouds();
    }

    /* ---------- physics ---------- */
    function update(dt) {
        for (var i = 0; i < clouds.length; i++) {
            var c = clouds[i];
            var w = SPRITE_W * c.scale * SF;
            c.x += c.speed * SF * dt;
            if (c.x > W + 10) c.x = -w - 10;
        }
        P.x += (P.tx - P.x) * 0.045;
        P.y += (P.ty - P.y) * 0.045;
    }

    /* ---------- sizing ---------- */
    function resize() {
        var oldW = W;
        DPR = Math.min(window.devicePixelRatio || 1, 1.5);
        W = window.innerWidth;
        H = window.innerHeight;
        SF = Math.max(0.55, Math.min(W / 1500, 1.7));

        canvas.width  = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        if (!clouds.length) {
            initClouds();
        } else if (oldW) {
            var f = W / oldW;
            clouds.forEach(function (c) { c.x *= f; });
        }
        draw();
    }

    /* ---------- animation loop (capped at ~30 fps) ---------- */
    function loop(now) {
        rafId = requestAnimationFrame(loop);
        if (!lastFrame) lastFrame = now;
        var dtMs = now - lastFrame;
        if (dtMs < 32) return;
        lastFrame = now;
        update(Math.min(dtMs, 120) / 1000);
        draw();
    }

    function start() {
        if (rafId) return;
        if (reduceMotion) { draw(); return; }
        lastFrame = 0;
        rafId = requestAnimationFrame(loop);
    }

    function stop() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    /* ---------- events ---------- */
    window.addEventListener('resize', resize, { passive: true });

    window.addEventListener('pointermove', function (e) {
        P.tx = (e.clientX / W) * 2 - 1;
        P.ty = (e.clientY / H) * 2 - 1;
    }, { passive: true });

    window.addEventListener('pointerleave', function () {
        P.tx = 0; P.ty = 0;
    }, { passive: true });

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) stop(); else start();
    });

    window.addEventListener('wallpaper:toggle', function (e) {
        if (e.detail && e.detail.on) start(); else stop();
    });

    resize();
    start();
})();


/* Wallpaper toggle — persisted in localStorage */
(function () {
    var btn = document.getElementById('wallpaperToggle');
    if (!btn) return;
    var KEY = 'wrmc.wallpaper';

    function apply(on) {
        document.body.classList.toggle('wp-off', !on);
        btn.classList.toggle('off', !on);
        btn.textContent = on ? '◐' : '○';
        btn.setAttribute('aria-pressed', String(on));
        window.dispatchEvent(new CustomEvent('wallpaper:toggle', { detail: { on: on } }));
    }

    var on = true;
    try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
    apply(on);

    btn.addEventListener('click', function () {
        on = !on;
        try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {}
        apply(on);
    });
})();
</script>
