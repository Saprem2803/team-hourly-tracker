<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMI | Admin Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --ink:#1a0508; --ink-3:#475569; --ink-4:#64748b;
    --line:#e2e8f0;
    --gold:#c9a227;
    --green:#0d7a4a;
    --blue:#c21825;
    --violet:#6d28d9;
    --navy-800:#1a0508;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#1e293b; font-size:14px; line-height:1.5;
    background-color:var(--navy-800);
    background-image:
        radial-gradient(ellipse 1000px 800px at 0% 0%,rgba(201,162,39,.14) 0%,transparent 55%),
        radial-gradient(ellipse 900px 800px at 100% 100%,rgba(122,18,37,.5) 0%,transparent 60%),
        linear-gradient(135deg,#1a0508 0%,#3a0a13 55%,#57101e 100%);
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* LIVE WALLPAPER CANVAS */
#liveWallpaper{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:1;
}

/* MAIN CONTAINER */
.admin-container{
    position:relative; z-index:3;
    width:100%; max-width:1100px;
    display:flex; flex-direction:column; gap:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.13);
    border-radius:16px;
    padding:20px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    max-height:calc(100vh - 40px);
    overflow-y:auto;
}

/* HEADER */
.admin-header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,.1);
    position:sticky; top:0; background:transparent; z-index:10;
}
.header-left{display:flex; align-items:center; gap:16px;}
.back-btn{
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:10px;
    background:rgba(255,255,255,.1); color:#fff;
    text-decoration:none; font-size:18px; transition:all .2s;
    border:1px solid rgba(255,255,255,.15);
}
.back-btn:hover{background:rgba(255,255,255,.2); transform:translateX(-3px);}
.header-title{
    font-family:'Playfair Display',Georgia,serif;
    font-size:24px; font-weight:700; color:#ffffff;
    letter-spacing:-.5px;
}
.header-subtitle{
    font-size:12px; color:rgba(255,255,255,.6); margin-top:2px;
}
.add-btn{
    display:flex; align-items:center; gap:8px;
    padding:10px 20px; border-radius:10px;
    background:linear-gradient(135deg,#fcd34d,#c9a227);
    color:#1a0508; font-weight:700; font-size:13px;
    border:none; cursor:pointer; transition:all .2s;
    box-shadow:0 4px 16px rgba(201,162,39,.3);
}
.add-btn:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(201,162,39,.4);}

/* TABLE */
.table-container{
    background:rgba(255,255,255,.95);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
}
table{width:100%; border-collapse:collapse;}
thead{background:#f8fafc; border-bottom:2px solid #e2e8f0;}
th{
    text-align:left; padding:14px 18px;
    font-size:11px; font-weight:800; color:#64748b;
    text-transform:uppercase; letter-spacing:.8px;
}
td{padding:14px 18px; border-bottom:1px solid #f1f5f9; font-size:13px; color:#1e293b;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}

.status-badge{
    display:inline-block; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:700; background:#d1fae5; color:#065f46;
}

/* ACTION BUTTONS */
.action-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px;
    border:1px solid #e2e8f0; background:#fff;
    cursor:pointer; transition:all .2s; font-size:14px;
}
.action-btn.edit{color:#6d28d9;}
.action-btn.edit:hover{background:#ede9fe; border-color:#a78bfa;}
.action-btn.delete{color:#c21825;}
.action-btn.delete:hover{background:#fee2e2; border-color:#ef4444;}

/* MODAL */
.modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px); z-index:100;
    display:none; align-items:center; justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal{
    background:#ffffff; border-radius:16px; padding:28px;
    width:100%; max-width:440px;
    box-shadow:0 24px 64px rgba(0,0,0,.4);
    animation:modalSlide .3s ease;
}
@keyframes modalSlide{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
.modal h3{
    font-family:'Playfair Display',Georgia,serif;
    font-size:20px; font-weight:700; color:#1a0508;
    margin-bottom:20px;
}
.form-group{margin-bottom:16px;}
.form-group label{
    display:block; font-size:12px; font-weight:700;
    color:#475569; margin-bottom:6px; text-transform:uppercase;
    letter-spacing:.5px;
}
.form-group input, .form-group select{
    width:100%; padding:10px 14px; border-radius:8px;
    border:1px solid #e2e8f0; font-size:14px;
    font-family:inherit; transition:all .2s;
}
.form-group input:focus, .form-group select:focus{
    outline:none; border-color:#c9a227;
    box-shadow:0 0 0 3px rgba(201,162,39,.15);
}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:24px;}
.btn{
    padding:10px 20px; border-radius:8px; font-size:13px;
    font-weight:700; cursor:pointer; transition:all .2s; border:none;
}
.btn-cancel{background:#f1f5f9; color:#475569;}
.btn-cancel:hover{background:#e2e8f0;}
.btn-save{background:linear-gradient(135deg,#fcd34d,#c9a227); color:#1a0508;}
.btn-save:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(201,162,39,.3);}
.btn-save:disabled{opacity:.6; cursor:not-allowed; transform:none;}

/* TOAST */
.toast{
    position:fixed; bottom:24px; right:24px; z-index:200;
    padding:14px 20px; border-radius:10px;
    color:#fff; font-weight:600; font-size:13px;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
    transform:translateY(100px); opacity:0;
    transition:all .3s ease;
}
.toast.show{transform:translateY(0); opacity:1;}
.toast.success{background:#0d7a4a;}
.toast.error{background:#c21825;}

/* LOADING */
.loading{text-align:center; padding:40px; color:#64748b; font-weight:600;}
</style>
</head>
<body>

<canvas id="liveWallpaper"></canvas>

<div class="admin-container">
    <!-- HEADER -->
    <div class="admin-header">
        <div class="header-left">
            <a href="index.html" class="back-btn">←</a>
            <div>
                <div class="header-title">Managers</div>
                <div class="header-subtitle">Managers have full admin access.</div>
            </div>
        </div>
        <button class="add-btn" onclick="openAddModal()">+ Add Manager</button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
            </thead>
            <tbody id="managers-tbody">
                <tr><td colspan="5" class="loading">Loading managers...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h3>Add New Manager</h3>
        <form id="addForm" onsubmit="submitAddManager(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="addName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="addEmail" placeholder="john@aminfoweb.co.in" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="addPassword" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="addRole">
                    <option value="management">Management</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" onclick="closeModal('addModal')">Cancel</button>
                <button type="submit" class="btn btn-save" id="addSubmitBtn">Create Manager</button>
            </div>
        </form>
    </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3>Edit Manager</h3>
        <form id="editForm" onsubmit="submitEditManager(event)">
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editName" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="editRole">
                    <option value="management">Management</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                <button type="submit" class="btn btn-save" id="editSubmitBtn">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SUPABASE & APP LOGIC -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ============================================================
    // ⚠️ REPLACE THESE WITH YOUR SUPABASE CREDENTIALS
    // ============================================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';       // e.g. https://xyz.supabase.co
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Your public anon key
    // ============================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let managersData = [];

    // ==========================================
    // TOAST NOTIFICATIONS
    // ==========================================
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ==========================================
    // MODAL CONTROLS
    // ==========================================
    function openAddModal() {
        document.getElementById('addForm').reset();
        document.getElementById('addModal').classList.add('active');
    }

    function openEditModal(userId, name, role) {
        document.getElementById('editUserId').value = userId;
        document.getElementById('editName').value = name;
        document.getElementById('editRole').value = role;
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    // ==========================================
    // FETCH MANAGERS
    // ==========================================
    async function fetchManagers() {
        const tbody = document.getElementById('managers-tbody');
        try {
            const { data, error } = await supabase
                .from('user_project_access')
                .select('*')
                .order('full_name', { ascending: true });

            if (error) throw error;

            managersData = data || [];
            renderTable();
        } catch (error) {
            console.error('Error fetching managers:', error);
            tbody.innerHTML = `<tr><td colspan="5" class="loading" style="color:#c21825;">Failed to load managers: ${error.message}</td></tr>`;
        }
    }

    // ==========================================
    // RENDER TABLE
    // ==========================================
    function renderTable() {
        const tbody = document.getElementById('managers-tbody');
        if (managersData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="loading">No managers found. Click "+ Add Manager" to create one.</td></tr>`;
            return;
        }

        tbody.innerHTML = managersData.map(m => `
            <tr>
                <td><strong>${m.full_name || '—'}</strong></td>
                <td>${m.email || '—'}</td>
                <td>${m.phone || '—'}</td>
                <td><span class="status-badge">Active</span></td>
                <td style="text-align:right;">
                    <button class="action-btn edit" onclick="openEditModal('${m.user_id}', '${m.full_name || ''}', '${m.role || 'management'}')" title="Edit">✏️</button>
                    <button class="action-btn delete" onclick="deleteManager('${m.user_id}', '${m.full_name || ''}')" title="Delete">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    // ==========================================
    // ADD MANAGER
    // ==========================================
    async function submitAddManager(e) {
        e.preventDefault();
        const btn = document.getElementById('addSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Creating...';

        const payload = {
            action: 'create',
            full_name: document.getElementById('addName').value.trim(),
            email: document.getElementById('addEmail').value.trim(),
            password: document.getElementById('addPassword').value,
            role: document.getElementById('addRole').value,
            project_id: null
        };

        try {
            const { data, error } = await supabase.functions.invoke('admin-users', { body: payload });
            if (error) throw error;
            if (data.error) throw new Error(data.error);

            showToast('Manager created successfully!', 'success');
            closeModal('addModal');
            fetchManagers();
        } catch (error) {
            console.error('Add error:', error);
            showToast(error.message || 'Failed to create manager', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Manager';
        }
    }

    // ==========================================
    // EDIT MANAGER
    // ==========================================
    async function submitEditManager(e) {
        e.preventDefault();
        const btn = document.getElementById('editSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const payload = {
            action: 'update',
            user_id: document.getElementById('editUserId').value,
            full_name: document.getElementById('editName').value.trim(),
            role: document.getElementById('editRole').value,
            project_id: null
        };

        try {
            const { data, error } = await supabase.functions.invoke('admin-users', { body: payload });
            if (error) throw error;
            if (data.error) throw new Error(data.error);

            showToast('Manager updated successfully!', 'success');
            closeModal('editModal');
            fetchManagers();
        } catch (error) {
            console.error('Update error:', error);
            showToast(error.message || 'Failed to update manager', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save Changes';
        }
    }

    // ==========================================
    // DELETE MANAGER
    // ==========================================
    async function deleteManager(userId, userName) {
        const confirmed = confirm(`Are you sure you want to delete ${userName || 'this manager'}? This cannot be undone.`);
        if (!confirmed) return;

        try {
            const { data, error } = await supabase.functions.invoke('admin-users', {
                body: { action: 'delete', user_id: userId }
            });
            if (error) throw error;
            if (data.error) throw new Error(data.error);

            showToast('Manager deleted successfully!', 'success');
            fetchManagers();
        } catch (error) {
            console.error('Delete error:', error);
            showToast(error.message || 'Failed to delete manager', 'error');
        }
    }

    // ==========================================
    // INIT
    // ==========================================
    fetchManagers();

    // ==========================================
    // LIVE WALLPAPER (Particles)
    // ==========================================
    (function(){
        const canvas = document.getElementById('liveWallpaper');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        let particles = [];
        let animationId = null;
        const CONFIG = { density: 12000, maxParticles: 140, minRadius: 1.2, maxRadius: 2.8, speed: 0.5, connectionDist: 180, goldRatio: 0.35, whiteDotAlpha: 0.85, goldDotAlpha: 1.0, lineAlpha: 0.35, glowBlur: 12 };

        function resize(){
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr;
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initParticles();
        }
        function initParticles(){
            const count = Math.min(CONFIG.maxParticles, Math.floor((width * height) / CONFIG.density));
            particles = [];
            for(let i = 0; i < count; i++){
                particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    vx: (Math.random() - 0.5) * CONFIG.speed, vy: (Math.random() - 0.5) * CONFIG.speed,
                    r: CONFIG.minRadius + Math.random() * (CONFIG.maxRadius - CONFIG.minRadius),
                    gold: Math.random() < CONFIG.goldRatio
                });
            }
        }
        function update(){
            for(const p of particles){
                p.x += p.vx; p.y += p.vy;
                if(p.x < -10) p.x = width + 10; else if(p.x > width + 10) p.x = -10;
                if(p.y < -10) p.y = height + 10; else if(p.y > height + 10) p.y = -10;
            }
        }
        function draw(){
            ctx.clearRect(0, 0, width, height);
            for(let i = 0; i < particles.length; i++){
                for(let j = i + 1; j < particles.length; j++){
                    const a = particles[i], b = particles[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const distSq = dx*dx + dy*dy;
                    const maxD = CONFIG.connectionDist;
                    if(distSq < maxD * maxD){
                        const dist = Math.sqrt(distSq);
                        const alpha = (1 - dist / maxD) * CONFIG.lineAlpha;
                        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = (a.gold && b.gold) ? `rgba(230,195,70,${alpha})` : `rgba(255,255,255,${alpha})`;
                        ctx.lineWidth = 1.0; ctx.stroke();
                    }
                }
            }
            for(const p of particles){
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                if(p.gold){ ctx.fillStyle = `rgba(220,180,55,${CONFIG.goldDotAlpha})`; ctx.shadowColor = 'rgba(201,162,39,0.95)'; }
                else { ctx.fillStyle = `rgba(255,255,255,${CONFIG.whiteDotAlpha})`; ctx.shadowColor = 'rgba(255,255,255,0.75)'; }
                ctx.shadowBlur = CONFIG.glowBlur; ctx.fill(); ctx.shadowBlur = 0;
            }
        }
        function loop(){ update(); draw(); animationId = requestAnimationFrame(loop); }
        function start(){ if(animationId) return; loop(); }
        function stop(){ if(animationId){ cancelAnimationFrame(animationId); animationId = null; } }
        window.addEventListener('resize', () => { resize(); });
        document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
        resize(); start();
    })();
</script>
</body>
</html>
