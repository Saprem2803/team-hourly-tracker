<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Password Reset</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #071a33, #123b63);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 460px;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 35px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #123b63;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #123b63;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #123b63;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0b2b4d;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.message {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    font-size: 14px;
}

.success {
    display: block;
    background: #e7f7ed;
    color: #18733c;
    border: 1px solid #b8e5c8;
}

.error {
    display: block;
    background: #fdecec;
    color: #a52222;
    border: 1px solid #f3bcbc;
}

.note {
    margin-top: 22px;
    padding: 12px;
    background: #f4f6f8;
    border-radius: 8px;
    font-size: 12px;
    color: #666;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            AMI Admin
        </div>

        <div class="subtitle">
            Reset Employee Password
        </div>

        <label for="email">
            Employee Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="firstname.lastname@aminfoweb.co.in"
            autocomplete="off"
        >

        <label for="password">
            New Temporary Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter temporary password"
            autocomplete="new-password"
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter temporary password"
            autocomplete="new-password"
        >

        <button id="resetButton" onclick="resetPassword()">
            Reset Password
        </button>

        <div id="message" class="message"></div>

        <div class="note">
            This page is intended for authorized administrators only.
            The employee can use the temporary password to log in and
            then change their password.
        </div>

    </div>

</div>

<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   RESET PASSWORD
========================================================= */

async function resetPassword() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const button =
        document.getElementById("resetButton");

    const message =
        document.getElementById("message");


    message.className = "message";
    message.style.display = "none";
    message.textContent = "";


    /* Validation */

    if (!email) {
        showError("Please enter the employee email.");
        return;
    }

    if (!password) {
        showError("Please enter a temporary password.");
        return;
    }

    if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
    }

    if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
    }


    button.disabled = true;
    button.textContent = "Resetting...";


    try {

        /*
         * Call the Supabase Edge Function
         */

        const { data, error } =
            await supabaseClient.functions.invoke(
                "admin-reset-password",
                {
                    body: {
                        email: email,
                        password: password
                    }
                }
            );


        if (error) {
            throw error;
        }


        if (!data || !data.success) {
            throw new Error(
                data?.error || "Password reset failed."
            );
        }


        showSuccess(
            "Password reset successfully for " +
            data.email
        );


        /*
         * Clear password fields
         */

        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";


    } catch (error) {

        console.error("Password reset error:", error);

        showError(
            error.message ||
            "Unable to reset password."
        );

    } finally {

        button.disabled = false;
        button.textContent = "Reset Password";

    }
}


/* =========================================================
   SUCCESS MESSAGE
========================================================= */

function showSuccess(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message success";

    message.style.display = "block";
}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function showError(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message error";

    message.style.display = "block";
}

</script>

</body>
</html>
