<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AMI | RCM Executive Dashboard</title>
<!-- Fonts and styles omitted for brevity, include your existing styles here -->
<!-- ... your existing styles ... -->
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-page">
  <!-- login form omitted for brevity -->
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" class="hidden">
  <header class="header">
    <!-- header content omitted for brevity -->
  </header>

  <main class="page">
    <!-- TOOLBAR -->
    <div class="toolbar">
      <!-- existing filters -->
      <div class="filter-group">
        <label>Report Date</label>
        <input id="trackerDate" type="date" onchange="loadDashboard()"/>
      </div>
      <div class="filter-group">
        <label>Period</label>
        <div class="period-switch" id="periodToggle">
          <button data-period="day" class="active" onclick="setPeriod('day')">Daily</button>
          <button data-period="mtd" onclick="setPeriod('mtd')">Month to Date</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Project</label>
        <select id="projectFilter" onchange="onProjectChange()">
          <option value="ALL">All Projects</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Subproject</label>
        <select id="subProjectFilter" onchange="applyFilters()">
          <option value="ALL">All Subprojects</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Team Lead</label>
        <select id="teamLeadFilter" onchange="applyFilters()">
          <option value="ALL">All Team Leads</option>
        </select>
      </div>
      <!-- other toolbar elements omitted for brevity -->
    </div>
    <!-- rest of dashboard omitted for brevity -->
  </main>
</div>

<!-- EXPORT MODAL omitted for brevity -->

<!-- Your scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
<script>
/* Your existing supabase config and variables */
const SUPABASE_URL = "https://yhoblmvujfqnspaxdfav.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_fiXzds8sZeg1f5cNcnzhlQ_Gm_x71af";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let employees = [], projects = [], subProjects = [], accessRows = [], filteredEmployees = [];
let currentUser = null, currentDate = null;
let currentPeriod = "day";

// Load subProjects data
async function loadSubProjects() {
  const { data, error } = await sb.from("sub_projects").select("*").eq("active", true);
  if(error){ console.warn("sub_projects load error:", error.message); subProjects=[]; return; }
  subProjects = data || [];
}

// Load projects data
async function loadProjects() {
  const { data, error } = await sb.from("projects").select("*").order("id",{ascending:true});
  if(error){ console.warn("projects load error:", error.message); projects=[]; return; }
  projects = data || [];
}

// Populate project filter
function populateProjectFilter() {
  const pf = document.getElementById("projectFilter");
  pf.innerHTML = `<option value="ALL">All Projects</option>`;
  projects.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.project_name || `Project ${p.id}`;
    pf.appendChild(opt);
  });
}

// When project changes
function onProjectChange() {
  updateSubProjectFilter();
  applyFilters();
}

// Update subproject options based on selected project
function updateSubProjectFilter() {
  const projectId = document.getElementById("projectFilter").value;
  const subSelect = document.getElementById("subProjectFilter");
  const currentVal = subSelect.value;
  subSelect.innerHTML = `<option value="ALL">All Subprojects</option>`;
  if(projectId === "ALL") return;
  const relevantSubs = subProjects.filter(sp => String(sp.project_id)===String(projectId) && sp.active!==false);
  relevantSubs.forEach(sp => {
    const opt = document.createElement("option");
    opt.value = sp.id;
    opt.textContent = sp.sub_project_name || `Subproject ${sp.id}`;
    subSelect.appendChild(opt);
  });
  // Reset selection if previous value invalid
  if(![...subSelect.options].some(o=>o.value===currentVal)) subSelect.value="ALL";
}

// Load employees
async function loadEmployees() {
  const { data, error } = await sb.from("employees").select("*").eq("active",true).order("employee_name",{ascending:true});
  if(error){ console.warn("employees load error:", error.message); employees=[]; return; }
  employees = data || [];
}

// Load access
async function loadAccessRows() {
  const { data, error } = await sb.from("user_project_access").select("*");
  if(error){ console.warn("access load error:", error.message); accessRows=[]; return; }
  accessRows = data || [];
}

// Load dashboard data
async function loadDashboard() {
  currentDate = document.getElementById("trackerDate").value;
  if(!currentDate){ alert("Select a date"); return; }
  // load data
  await loadAccessRows();
  await loadProjects();
  await loadSubProjects();
  await loadEmployees();
  // populate filters
  populateProjectFilter();
  updateSubProjectFilter();
  applyFilters();
}

// Apply filters to employees
function applyFilters() {
  const pv = document.getElementById("projectFilter").value;
  const spv = document.getElementById("subProjectFilter").value;
  const tv = document.getElementById("teamLeadFilter").value;

  filteredEmployees = employees.map(buildEmployeeMetric).filter(m => {
    if(pv !== "ALL" && String(m.employee.project_id)!==String(pv)) return false;
    if(spv !== "ALL" && String(m.employee.sub_project_id)!==String(spv)) return false;
    if(tv !== "ALL"){
      const lead = getTeamLeadForProject(m.employee.project_id);
      if(!lead.split(",").map(x=>x.trim()).includes(tv)) return false;
    }
    return true;
  });
  renderAll();
}

// Dummy functions for building metrics
function buildEmployeeMetric(employee) {
  // For simplicity, just returning employee as object
  return { employee, project: getProjectById(employee.project_id), subproject: getSubProjectById(employee.sub_project_id) };
}
function getProjectById(id) { return projects.find(p=>String(p.id)===String(id)); }
function getSubProjectById(id) { return subProjects.find(s=>String(s.id)===String(id)); }

function getTeamLeadForProject(projectId) {
  const rows = accessRows.filter(r => String(r.project_id)===String(projectId) && String(r.role).toLowerCase()==="team_lead");
  const names = rows.map(r => String(r.team_lead_name).trim()).filter(Boolean);
  if(names.length) return [...new Set(names)].join(", ");
  // fallback
  return "Unassigned";
}

// Render all
function renderAll() {
  // your rendering functions...
  // e.g., renderKPIs(), renderHero(), renderProjectTable(), etc.
  // For brevity, these functions are not fully rewritten here.
  // Implement as per your existing setup.
}

// Initialize
async function init() {
  await loadEmployees();
  await loadProjects();
  await loadSubProjects();
  populateProjectFilter();
  updateSubProjectFilter();
  applyFilters();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
